<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Installment Calculator — Emre Kartın</title>
  <meta name="description" content="Aylık taksit, toplam ödeme ve faiz." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=9" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Installment Calculator</h1>

    <div class="field">
      <label for="ins-amount">Tutar</label>
      <input id="ins-amount" class="mono" type="text" inputmode="decimal" placeholder="10000" />
    </div>
    <div class="row-2">
      <div class="field">
        <label for="ins-months">Ay</label>
        <input id="ins-months" class="mono" type="text" inputmode="numeric" placeholder="12" />
      </div>
      <div class="field">
        <label for="ins-rate">Aylık faiz</label>
        <input id="ins-rate" class="mono" type="text" inputmode="decimal" placeholder="0" />
      </div>
    </div>
    <p id="ins-out" class="status" aria-live="polite"></p>
    <p id="ins-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="ins-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
