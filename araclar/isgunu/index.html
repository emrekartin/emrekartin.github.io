<!doctype html>
<html lang="tr" translate="no">
<script>try{if(localStorage.getItem("ek-theme")=="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İş Günü — Emre Kartın</title>
  <meta name="description" content="İki tarih arasındaki iş günü. Hafta sonu ve resmi tatil düşülür." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=13" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">İş Günü</h1>

    <div class="row-2">
      <div class="field">
        <label for="work-from">Başlangıç</label>
        <input id="work-from" class="tr-date" type="text" inputmode="numeric" placeholder="07.11.2026" autocomplete="off" />
      </div>
      <div class="field">
        <label for="work-to">Bitiş</label>
        <input id="work-to" class="tr-date" type="text" inputmode="numeric" placeholder="07.11.2026" autocomplete="off" />
      </div>
    </div>
    <p class="status">Resmi tatil 2429 ve Diyanet bayramları, 2005–2027. İdari izin sayılmaz. Yarım gün 0,5 iş günü.</p>
    <p id="work-out" class="status" aria-live="polite"></p>
    <p id="work-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="work-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="/araclar/tr-sec.js?v=2"></script>
  <script src="./app.js"></script>
<script src="/site.js?v=1"></script>
</body>
</html>
