<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Date Difference — Emre Kartın</title>
  <meta name="description" content="İki tarih arası yıl, ay ve gün." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=10" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Date Difference</h1>

    <div class="row-2">
      <div class="field">
        <label for="date-from">Başlangıç</label>
        <input id="date-from" type="date" />
      </div>
      <div class="field">
        <label for="date-to">Bitiş</label>
        <input id="date-to" type="date" />
      </div>
    </div>
    <p id="date-out" class="status" aria-live="polite"></p>
    <p id="date-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="date-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
