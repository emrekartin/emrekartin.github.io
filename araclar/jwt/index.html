<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JWT Decoder — Emre Kartın</title>
  <meta name="description" content="JWT başlığını ve içeriğini tarayıcıda gösterir." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=7" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">JWT Decoder</h1>

    <div class="field">
      <label for="jwt-in">Token</label>
      <textarea id="jwt-in" class="mono" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label for="jwt-header">Başlık</label>
      <textarea id="jwt-header" class="mono" readonly spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label for="jwt-payload">İçerik</label>
      <textarea id="jwt-payload" class="mono" readonly spellcheck="false"></textarea>
    </div>
    <p id="jwt-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="jwt-read">Oku</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
