<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unix zaman çevir — Emre Kartın</title>
  <meta name="description" content="Unix zamanını yerel tarihe, tarihi Unix zamana çevir." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=7" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Unix zaman çevir</h1>

    <div class="field">
      <label for="unix-in">Unix</label>
      <input id="unix-in" class="mono" type="text" inputmode="decimal" placeholder="1710000000 veya milisaniye" />
    </div>
    <div class="field">
      <label for="unix-date">Yerel tarih</label>
      <input id="unix-date" type="datetime-local" step="1" />
    </div>
    <p id="unix-out" class="status" aria-live="polite"></p>
    <p id="unix-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="unix-from">Unix'ten çevir</button>
      <button type="button" id="date-from" class="ghost">Tarihten çevir</button>
      <button type="button" id="unix-now" class="ghost">Şimdi</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
