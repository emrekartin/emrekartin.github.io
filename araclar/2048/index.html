<!doctype html>
<html lang="tr" translate="no">
<script>try{var t=localStorage.getItem("ek-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048 — Emre Kartın</title>
  <meta name="description" content="2048 oyna. Kaydır, aynı sayıları birleştir, 2048'e ulaş." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=30" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Araçlar</a>
        <a href="/yazi/">Yazılar</a>
      </nav>
    </header>

    <h1 class="page-title">2048</h1>

    <div class="game-bar">
      <div class="game-stat"><span>Skor</span><strong id="g-score">0</strong></div>
      <div class="game-stat"><span>En iyi</span><strong id="g-best">0</strong></div>
      <span class="grow"></span>
      <button type="button" id="g-undo" class="ghost" disabled>Geri al</button>
      <button type="button" id="g-new">Yeni oyun</button>
    </div>
    <div id="g-board" class="g2048" aria-label="Oyun tahtası"></div>
    <p id="g-msg" class="game-msg" aria-live="polite"></p>
    <p class="game-help">Ok tuşları ya da WASD ile, telefonda parmağınla kaydır. Aynı sayılar çarpışınca birleşir.</p>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="/araclar/oyun-ses.js?v=1"></script>
  <script src="./app.js?v=3"></script>
<script src="/site.js?v=11"></script>
</body>
</html>
