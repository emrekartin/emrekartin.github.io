<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Date Offset — Emre Kartın</title>
  <meta name="description" content="Bir tarihe gün, ay veya yıl ekler." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=11" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Date Offset</h1>

    <div class="row-3">
      <div class="field">
        <label for="off-date">Tarih</label>
        <input id="off-date" class="tr-date" type="text" inputmode="numeric" placeholder="07.11.2026" autocomplete="off" />
      </div>
      <div class="field">
        <label for="off-amount">Sayı</label>
        <input id="off-amount" class="mono" type="text" inputmode="numeric" placeholder="90" />
      </div>
      <div class="field">
        <label for="off-unit">Birim</label>
        <select id="off-unit">
          <option value="day">Gün</option>
          <option value="month">Ay</option>
          <option value="year">Yıl</option>
        </select>
      </div>
    </div>
    <p id="off-out" class="status" aria-live="polite"></p>
    <p id="off-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="off-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="/araclar/tr-sec.js"></script>
  <script src="./app.js"></script>
</body>
</html>
