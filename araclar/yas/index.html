<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Age Calculator — Emre Kartın</title>
  <meta name="description" content="Doğum tarihinden yaş: yıl, ay, gün ve sıradaki yaş günü." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=11" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Age Calculator</h1>

    <div class="row-2">
      <div class="field">
        <label for="age-birth">Doğum</label>
        <input id="age-birth" class="tr-date" type="text" inputmode="numeric" placeholder="07.11.2026" autocomplete="off" />
      </div>
      <div class="field">
        <label for="age-on">Gün</label>
        <input id="age-on" class="tr-date" type="text" inputmode="numeric" placeholder="07.11.2026" autocomplete="off" />
      </div>
    </div>
    <p id="age-out" class="status" aria-live="polite"></p>
    <p id="age-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="age-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="/araclar/tr-sec.js"></script>
  <script src="./app.js"></script>
</body>
</html>
