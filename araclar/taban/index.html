<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Base — Emre Kartın</title>
  <meta name="description" content="Onluk, hex ve ikili sayıyı birbirine çevirir." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=8" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Base</h1>

    <div class="field">
      <label for="base-dec">Decimal</label>
      <input id="base-dec" class="mono" type="text" inputmode="numeric" />
    </div>
    <div class="field">
      <label for="base-hex">Hex</label>
      <input id="base-hex" class="mono" type="text" spellcheck="false" />
    </div>
    <div class="field">
      <label for="base-bin">Binary</label>
      <input id="base-bin" class="mono" type="text" inputmode="numeric" spellcheck="false" />
    </div>
    <p id="base-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="from-dec">Decimal</button>
      <button type="button" id="from-hex" class="ghost">Hex</button>
      <button type="button" id="from-bin" class="ghost">Binary</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
