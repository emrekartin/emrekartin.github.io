<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interest Calculator — Emre Kartın</title>
  <meta name="description" content="Basit veya bileşik faiz. Yıllık oran, gün, ay veya yıl." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=9" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Interest Calculator</h1>

    <div class="field">
      <label for="int-amount">Anapara</label>
      <input id="int-amount" class="mono" type="text" inputmode="decimal" placeholder="10000" />
    </div>
    <div class="row-2">
      <div class="field">
        <label for="int-rate">Yıllık oran</label>
        <input id="int-rate" class="mono" type="text" inputmode="decimal" placeholder="45" />
      </div>
      <div class="field">
        <label for="int-span">Süre</label>
        <input id="int-span" class="mono" type="text" inputmode="numeric" placeholder="12" />
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="int-unit">Birim</label>
        <select id="int-unit">
          <option value="day">Gün</option>
          <option value="month" selected>Ay</option>
          <option value="year">Yıl</option>
        </select>
      </div>
      <div class="field">
        <label for="int-kind">Tür</label>
        <select id="int-kind">
          <option value="simple" selected>Basit</option>
          <option value="compound">Bileşik</option>
        </select>
      </div>
    </div>
    <p id="int-out" class="status" aria-live="polite"></p>
    <p id="int-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="int-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
