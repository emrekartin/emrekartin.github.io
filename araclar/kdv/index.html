<!doctype html>
<html lang="tr" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KDV Calculator — Emre Kartın</title>
  <meta name="description" content="KDV ekle veya ayır. Oran %1, %10 veya %20." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=9" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">KDV Calculator</h1>

    <div class="field">
      <label for="kdv-amount">Tutar</label>
      <input id="kdv-amount" class="mono" type="text" inputmode="decimal" placeholder="1000" />
    </div>
    <div class="field">
      <label for="kdv-rate">Oran</label>
      <select id="kdv-rate">
        <option value="1">%1</option>
        <option value="10">%10</option>
        <option value="20" selected>%20</option>
      </select>
    </div>
    <p id="kdv-out" class="status" aria-live="polite"></p>
    <p id="kdv-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="kdv-add">KDV ekle</button>
      <button type="button" id="kdv-split" class="ghost">KDV ayır</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
