<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discount Calculator — Emre Kartın</title>
  <meta name="description" content="İndirim oranı ve indirimli tutar." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=9" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Discount Calculator</h1>

    <div class="row-2">
      <div class="field">
        <label for="disc-amount">Tutar</label>
        <input id="disc-amount" class="mono" type="text" inputmode="decimal" placeholder="1000" />
      </div>
      <div class="field">
        <label for="disc-rate">İndirim</label>
        <input id="disc-rate" class="mono" type="text" inputmode="decimal" placeholder="25" />
      </div>
    </div>
    <p id="disc-out" class="status" aria-live="polite"></p>
    <p id="disc-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="disc-run">Hesapla</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
