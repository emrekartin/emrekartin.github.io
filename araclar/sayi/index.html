<!doctype html>
<html lang="tr" translate="no">
<script>try{if(localStorage.getItem("ek-theme")=="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rastgele Sayı — Emre Kartın</title>
  <meta name="description" content="İki sayı arasından rastgele seç. Tekrarlı veya tekrarsız." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=13" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Rastgele Sayı</h1>

    <div class="row-3">
      <div class="field">
        <label for="num-min">En az</label>
        <input id="num-min" type="number" value="1" />
      </div>
      <div class="field">
        <label for="num-max">En çok</label>
        <input id="num-max" type="number" value="100" />
      </div>
      <div class="field">
        <label for="num-count">Adet</label>
        <input id="num-count" type="number" min="1" max="50" value="1" />
      </div>
    </div>
    <div class="field">
      <label for="num-mode">Tekrar</label>
      <select id="num-mode">
        <option value="unique">Tekrarsız</option>
        <option value="repeat">Tekrarlı</option>
      </select>
    </div>
    <p id="num-out" class="status" aria-live="polite"></p>
    <p id="num-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="num-run">Seç</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
<script src="/site.js?v=1"></script>
</body>
</html>
