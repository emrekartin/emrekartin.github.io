<!doctype html>
<html lang="tr" translate="no">
<script>try{var t=localStorage.getItem("ek-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hafıza Kartları — Emre Kartın</title>
  <meta name="description" content="Hafıza oyunu. Kartları çevir, eşleri bul. Hamle ve süre sayılır." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=30" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Araçlar</a>
        <a href="/yazi/">Yazılar</a>
      </nav>
    </header>

    <h1 class="page-title">Hafıza Kartları</h1>

    <div class="game-bar">
      <div class="game-stat"><span>Hamle</span><strong id="h-moves">0</strong></div>
      <div class="game-stat"><span>Süre</span><strong id="h-time">0</strong></div>
      <div class="game-stat"><span>En iyi</span><strong id="h-best">—</strong></div>
      <span class="grow"></span>
      <select id="h-level" aria-label="Seviye">
        <option value="12">Kolay · 12 kart</option>
        <option value="16" selected>Orta · 16 kart</option>
        <option value="24">Zor · 24 kart</option>
        <option value="36">Uzman · 36 kart</option>
      </select>
      <button type="button" id="h-new">Yeni oyun</button>
    </div>
    <div id="h-grid" class="memo" aria-label="Kartlar"></div>
    <p id="h-msg" class="game-msg" aria-live="polite"></p>
    <p class="game-help">İki kart çevir. Aynıysa açık kalır, değilse geri döner. En az hamleyle bitir.</p>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="/araclar/oyun-ses.js?v=1"></script>
  <script src="./app.js?v=2"></script>
<script src="/site.js?v=11"></script>
</body>
</html>
