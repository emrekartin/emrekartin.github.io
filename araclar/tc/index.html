<!doctype html>
<html lang="tr" translate="no">
<script>try{var t=localStorage.getItem("ek-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TC No — Emre Kartın</title>
  <meta name="description" content="Kontrol basamağı tutan 11 haneli TC kimlik no üretir. Tarayıcıda kalır." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=14" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Araçlar</a>
        <a href="/yazi/">Yazılar</a>
      </nav>
    </header>

    <h1 class="page-title">TC No</h1>

    <div class="field">
      <label for="tc-out">TC kimlik no</label>
      <input id="tc-out" class="mono" type="text" inputmode="numeric" maxlength="11" />
    </div>
    <div class="actions">
      <button type="button" id="tc-new">Üret</button>
      <button type="button" id="tc-check" class="ghost">Kontrol et</button>
      <button type="button" id="tc-copy" class="ghost">Kopyala</button>
    </div>
    <p id="tc-status" class="status" aria-live="polite"></p>
    <p id="tc-error" class="error" role="alert"></p>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
<script src="/site.js?v=2"></script>
</body>
</html>
