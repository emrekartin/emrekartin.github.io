<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Currency Converter — Emre Kartın</title>
  <meta name="description" content="ECB referans kuruyla döviz çevirir. Kur tarayıcıda alınır." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/site.css?v=9" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Software Developer · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Kullanılabilir araçlar</a>
      </nav>
    </header>

    <h1 class="page-title">Currency Converter</h1>

    <div class="field">
      <label for="fx-amount">Tutar</label>
      <input id="fx-amount" class="mono" type="text" inputmode="decimal" value="1" />
    </div>
    <div class="row-2">
      <div class="field">
        <label for="fx-from">Birim</label>
        <select id="fx-from"></select>
      </div>
      <div class="field">
        <label for="fx-to">Hedef</label>
        <select id="fx-to"></select>
      </div>
    </div>
    <p id="fx-out" class="status" aria-live="polite"></p>
    <p id="fx-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="fx-run">Çevir</button>
      <button type="button" id="fx-swap" class="ghost">Yer değiştir</button>
    </div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
