<!doctype html>
<html lang="tr" translate="no">
<script>try{var t=localStorage.getItem("ek-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regex — Emre Kartın</title>
  <meta name="description" content="Düzenli ifadeyi metinde dener. Eşleşmeler tarayıcıda kalır." />
  <meta name="theme-color" content="#d5dce6" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/site.css?v=14" />
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/">
        <strong>Emre Kartın</strong>
        <span>Yazılım geliştirici · Ankara</span>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">Ana sayfa</a>
        <a href="/araclar/" aria-current="page">Araçlar</a>
        <a href="/yazi/">Yazılar</a>
      </nav>
    </header>

    <h1 class="page-title">Regex</h1>

    <div class="field">
      <label for="re-pattern">Desen</label>
      <input id="re-pattern" class="mono" type="text" spellcheck="false" placeholder="\d+" />
    </div>
    <div class="actions">
      <label><input id="re-i" type="checkbox" /> i</label>
      <label><input id="re-m" type="checkbox" /> m</label>
      <label><input id="re-s" type="checkbox" /> s</label>
      <label><input id="re-g" type="checkbox" checked /> g</label>
    </div>
    <div class="field">
      <label for="re-text">Metin</label>
      <textarea id="re-text" class="mono" spellcheck="false"></textarea>
    </div>
    <div class="actions">
      <button type="button" id="re-run">Dene</button>
    </div>
    <p id="re-error" class="error" role="alert"></p>
    <div id="re-out" class="re-out"></div>

    <footer class="site-footer">
      <a href="/araclar/">← Kullanılabilir araçlar</a>
    </footer>
  </div>
  <script src="./app.js"></script>
  <script src="/site.js?v=2"></script>
</body>
</html>
