<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
    <title>Patates</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
      </div>
      <div id="gate">
        <h1>Patates</h1>
        <p id="intro">Çiftlikte patates soy. Tek başına ya da bir arkadaşınla oyna.</p>
        <label>
          Grafik
          <select id="quality">
            <option value="0">Düşük</option>
            <option value="1" selected>Orta</option>
            <option value="2">Yüksek</option>
          </select>
        </label>
        <button id="start" type="button">Oyunu Başlat</button>
        <p>WASD yürü, Shift hızlı, Ctrl eğil, E etkileşim, F sev, G bırak, Esc menü. Masada sol tık soy, sağ sürükle döndür.</p>
      </div>
      <div id="loading" style="display:none">
        <p>Mutfak ısınıyor…</p>
        <div id="bar"><div id="fill"></div></div>
      </div>
      <div id="warning"></div>
    </div>
    <script src="TemplateData/peerjs.min.js"></script>
    <script src="TemplateData/peerjs-network.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var gate = document.querySelector("#gate");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var quality = document.querySelector("#quality");

      document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      canvas.addEventListener("wheel", function (event) { event.preventDefault(); }, { passive: false });
      window.addEventListener("blur", function () {});

      try {
        var stored = localStorage.getItem("patates_quality");
        if (stored !== null) quality.value = stored;
      } catch (error) {}

      if (window.PotatoNet && window.PotatoNet.roomFromUrl()) {
        document.querySelector("#intro").textContent = "Arkadaşının odasına davet edildin. Oyun açılınca Odaya Katıl'a bas.";
        document.querySelector("#start").textContent = "Oyunu Aç ve Katıl";
      }

      function showWarning(message, type) {
        var host = document.querySelector("#warning");
        var line = document.createElement("div");
        line.textContent = message;
        line.style.background = type === "error" ? "#8c2f2f" : "#c9a15b";
        host.appendChild(line);
        if (type !== "error") {
          setTimeout(function () { line.remove(); }, 5000);
        }
      }

      document.querySelector("#start").addEventListener("click", function () {
        try { localStorage.setItem("patates_quality", quality.value); } catch (error) {}
        gate.style.display = "none";
        loading.style.display = "flex";

        var buildUrl = "Build";
        var config = {
          arguments: ["-quality", quality.value],
          dataUrl: buildUrl + "/WebGL.data.unityweb",
          frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
          codeUrl: buildUrl + "/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Patates",
          productName: "Patates",
          productVersion: "0.1.0",
          showBanner: showWarning,
          autoSyncPersistentDataPath: true,
          matchWebGLToCanvasSize: true,
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, quality.value === "0" ? 1 : 1.5)
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/WebGL.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            fill.style.width = (progress * 100) + "%";
            if (progress >= 1) loading.style.display = "none";
          }).then(function (instance) {
            window.potatoGame = instance;
            if (window.PotatoNet) window.PotatoNet.attach(instance);
          }).catch(function (message) {
            loading.style.display = "none";
            showWarning(String(message), "error");
          });
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
